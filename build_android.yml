name: Build Android APK

on:
  workflow_dispatch:        # run manually from GitHub website
  push:
    branches: [main]
    paths: ['android/**']   # auto-run only when android files change

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            git zip unzip \
            libffi-dev libssl-dev \
            libncurses5-dev libncursesw5-dev \
            zlib1g-dev autoconf automake libtool cmake pkg-config

      - name: Install Buildozer and Cython
        run: pip install buildozer==1.5.0 cython==0.29.36

      - name: Cache Android SDK / NDK and Buildozer downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.android
            ~/.gradle
          key: buildozer-${{ hashFiles('android/buildozer.spec') }}
          restore-keys: buildozer-

      - name: Build APK
        working-directory: android
        run: buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PaliTTS-android
          path: android/bin/*.apk
          retention-days: 90
