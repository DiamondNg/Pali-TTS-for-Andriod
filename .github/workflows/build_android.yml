name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**']

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Python 3.11 as system python3
        run: |
          sudo add-apt-repository ppa:deadsnakes/ppa -y
          sudo apt-get update -qq
          sudo apt-get install -y python3.11 python3.11-dev python3.11-distutils
          curl -sS https://bootstrap.pypa.io/get-pip.py | sudo python3.11
          sudo update-alternatives --install /usr/bin/python3 python3 /usr/bin/python3.11 20
          sudo update-alternatives --set python3 /usr/bin/python3.11
          python3 --version

      - name: Install system dependencies
        run: |
          sudo apt-get install -y \
            git zip unzip \
            libffi-dev libssl-dev \
            libncurses5-dev libncursesw5-dev \
            zlib1g-dev autoconf automake libtool cmake pkg-config

      - name: Install Buildozer and Cython
        run: python3.11 -m pip install buildozer==1.5.0 cython==0.29.36

      - name: Cache Android SDK / NDK and Buildozer downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.android
            ~/.gradle
          key: buildozer-${{ hashFiles('android/buildozer.spec') }}
          restore-keys: buildozer-

      - name: Build APK
        working-directory: android
        run: buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PaliTTS-android
          path: android/bin/*.apk
          retention-days: 30
