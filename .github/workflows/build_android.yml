name: Build Android app

on:
  workflow_dispatch:
  release:
    types: [published]   # creating a Release on the GitHub website builds + attaches the APK
  push:               # test builds on work branches only; main/tags are built by the Release
    branches: ['**', '!main']
    paths:
      - 'pali_tts.py'
      - 'android/**'
      - '.github/scripts/get_piper_model.sh'
      - '.github/scripts/android_*'
      - '.github/workflows/build_android.yml'

permissions:
  contents: write   # needed to attach the APK to the Release

concurrency:        # a new push stops the older run of the same branch
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python (Chaquopy needs the same version on the build machine)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Get the offline Piper voice (engine + Kannada model)
        run: bash .github/scripts/android_get_voice.sh

      - name: Build APK
        working-directory: android
        env:   # optional private signing key (GitHub secrets); without them the testing key is used
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease
          v=$(sed -n 's/^APP_VERSION = "\(.*\)"/\1/p' ../pali_tts.py)
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk "../dist/Read Pali Aloud v$v.apk"
          ls -l ../dist
          # Which key signed the APK (private key: SHA-256 starts 1B:A1:26:95)
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then echo "Signing: PRIVATE key (GitHub secrets)"; else echo "Signing: public TESTING key (no secrets)"; fi
          "$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner" verify --print-certs "../dist/Read Pali Aloud v$v.apk" | grep -i "SHA-256"

      - name: Put the Piper voice on the Release "android-voice" (the app downloads it from there)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f=$(ls dist-voice/*.zip)
          gh release view android-voice >/dev/null 2>&1 || gh release create android-voice \
            --prerelease --title "Offline Piper voice for the Android app" \
            --notes "Downloaded by the Android app when you choose the Piper voice. Voice: micahchoo/piper-kn (CC BY 4.0), converted for sherpa-onnx. Not an app release." \
            --target "$GITHUB_SHA"
          if gh release view android-voice --json assets --jq '.assets[].name' | grep -qx "$(basename "$f")"; then
            echo "already on the Release: $f"
          else
            gh release upload android-voice "$f"
          fi

      - name: Enable the emulator's hardware acceleration (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test on an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash .github/scripts/android_test.sh

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-screenshots
          path: shots/
          retention-days: 7

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PaliTTS-Android
          path: dist/*.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
