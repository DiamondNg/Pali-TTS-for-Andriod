name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**']

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build APK
        run: |
          docker run --rm \
            -v $GITHUB_WORKSPACE/android:/home/user/hostcwd \
            kivy/buildozer:ubuntu-python3.11 \
            android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PaliTTS-android
          path: android/bin/*.apk
          retention-days: 30
