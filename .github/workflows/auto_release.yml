name: Auto Release on version bump

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check RELEASE_PAT is set
        id: pat
        env:
          PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          if [ -z "$PAT" ]; then
            echo "has=false" >> "$GITHUB_OUTPUT"
            echo "::warning::RELEASE_PAT secret not set — skipping auto-release."
          else
            echo "has=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout
        if: steps.pat.outputs.has == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish Release if APP_VERSION is new
        if: steps.pat.outputs.has == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          VER=$(grep -E '^APP_VERSION' pali_tts.py | head -1 | sed -E 's/.*"([0-9]+\.[0-9]+(\.[0-9]+)?)".*/\1/')
          [ -n "$VER" ] || { echo "Could not read APP_VERSION"; exit 1; }
          TAG="v$VER"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "Release $TAG exists"; exit 0; fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "Read Pāli Aloud $VER" --generate-notes
          if ls ios/*.shortcut >/dev/null 2>&1; then gh release upload "$TAG" ios/*.shortcut; fi
