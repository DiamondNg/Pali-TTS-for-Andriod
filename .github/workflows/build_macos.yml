name: Build macOS DMG

on:
  workflow_dispatch:
  release:
    types: [published]   # creating a Release on the GitHub website builds + attaches the DMG
  push:               # test builds on work branches only; main/tags are built by the Release
    branches: ['**', '!main']
    paths:
      - 'Install Pali TTS.command'
      - 'pali_tts.py'
      - 'pali_core.py'
      - 'README_Mac.txt'
      - 'requirements-macos.txt'
      - 'assets/**'
      - '.github/scripts/**'
      - '!.github/scripts/android_*'   # Android-only scripts: no Mac build
      - '.github/workflows/build_macos.yml'

permissions:
  contents: write   # needed to attach the DMG to the Release

concurrency:        # a new push stops the older run of the same branch
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.21"

      # Self-contained Python (python-build-standalone, includes Tkinter) for
      # both chip types, with all packages pre-installed: users install nothing.
      - name: Build bundled Python runtimes
        env:
          PY_VERSION: "3.13"
        run: |
          set -e
          export UV_PYTHON_INSTALL_DIR="$RUNNER_TEMP/uvpy"
          uv python install "cpython-${PY_VERSION}-macos-aarch64-none" "cpython-${PY_VERSION}-macos-x86_64-none"
          ls "$UV_PYTHON_INSTALL_DIR"
          mkdir -p runtime
          ditto "$(ls -d "$UV_PYTHON_INSTALL_DIR"/cpython-"$PY_VERSION".*-macos-aarch64-none | head -1)" runtime/arm64
          ditto "$(ls -d "$UV_PYTHON_INSTALL_DIR"/cpython-"$PY_VERSION".*-macos-x86_64-none | head -1)" runtime/x86_64
          PIP_PY=runtime/arm64/bin/python3
          "$PIP_PY" -m pip --version || "$PIP_PY" -m ensurepip
          # Wheels no newer than the bundled Python's own minimum (Intel 10.15, Apple Silicon 11)
          for pair in "arm64 macosx_11_0_arm64" "x86_64 macosx_10_13_x86_64"; do
            set -- $pair
            SITE=$(ls -d runtime/"$1"/lib/python3.*/site-packages)
            "$PIP_PY" -m pip install --quiet --disable-pip-version-check --break-system-packages \
              --target "$SITE" --upgrade --only-binary=:all: --platform "$2" \
              --python-version "$PY_VERSION" --implementation cp \
              -r requirements-macos.txt
          done
          # Offline Piper voice: onnxruntime 1.23.2 is the last with Intel Mac wheels, and
          # needs macOS 13+ (the app still starts on older Macs; only Piper is unavailable).
          # --no-deps: onnxruntime's sympy/coloredlogs are not needed to run a voice.
          for pair in "arm64 macosx_13_0_arm64" "x86_64 macosx_13_0_x86_64"; do
            set -- $pair
            SITE=$(ls -d runtime/"$1"/lib/python3.*/site-packages)
            "$PIP_PY" -m pip install --quiet --disable-pip-version-check --break-system-packages \
              --target "$SITE" --upgrade --only-binary=:all: --platform "$2" \
              --python-version "$PY_VERSION" --implementation cp --no-deps \
              piper-tts==1.8.0 onnxruntime==1.23.2 numpy flatbuffers protobuf packaging pathvalidate
            python3 .github/scripts/slim_piper.py "$SITE"
          done
          # Slim down: no pip, tests, IDLE, caches
          for d in runtime/*; do
            L=$(ls -d "$d"/lib/python3.*)
            rm -rf "$L"/EXTERNALLY-MANAGED "$L"/test "$L"/idlelib "$L"/ensurepip "$L"/turtledemo \
                   "$L"/site-packages/pip "$L"/site-packages/pip-* "$L"/site-packages/bin
            find "$d" -name __pycache__ -type d -prune -exec rm -rf {} +
            # Developer-only files: headers, static libs, build config
            rm -rf "$d"/include "$d"/share "$d"/lib/pkgconfig "$d"/bin/python3*-config \
                   "$L"/config-3.*-darwin
            find "$d" -name '*.a' -delete
          done
          du -sh runtime/*
          du -sh runtime/arm64/lib/* runtime/arm64/lib/python3.*/site-packages/* | sort -h | tail -12

      - name: Report minimum macOS of bundled binaries
        run: |
          for arch in arm64 x86_64; do
            find runtime/$arch -type f \( -name '*.so' -o -name '*.dylib' -o -path '*/bin/python3.*' \) |
            while read -r f; do
              v=$(otool -l "$f" 2>/dev/null |
                  awk '/LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX/{f=1} f&&/^ *(minos|version) /{print $2; f=0}' | head -1)
              echo "$v ${f#runtime/$arch/}"
            done | grep -v '^ ' | sort -V > "min-$arch.txt"
            echo "$arch: requires macOS $(tail -1 "min-$arch.txt" | cut -d' ' -f1) or later; highest:"
            tail -5 "min-$arch.txt"
          done

      - name: Download the offline Piper voice (Hugging Face)
        run: bash .github/scripts/get_piper_model.sh

      - name: Test Intel runtime under Rosetta
        run: |
          arch -x86_64 runtime/x86_64/bin/python3 -c 'import platform, edge_tts, tkinter, certifi; tkinter.Tcl(); print(platform.machine(), platform.python_version(), "OK")'
          PYTHONPATH=. arch -x86_64 runtime/x86_64/bin/python3 -c 'import sys; sys.argv = ["x"]; import pali_tts; print(pali_tts._to_kannada_local("evaṃ me sutaṃ"))'
          # Piper (offline Pāli voice) on Intel
          PYTHONPATH=. arch -x86_64 runtime/x86_64/bin/python3 -c 'import sys, wave; sys.argv = ["x"]; import pali_tts as p; p.piper_to_wav(p.to_kannada("Evaṃ me sutaṃ. Ekaṃ samayaṃ bhagavā"), "intel.wav", 1.0); w = wave.open("intel.wav"); s = w.getnframes() / w.getframerate(); print("Intel Piper %.2f s" % s); assert s > 1'

      - name: Build DMG
        run: |
          set -e
          STAGE="$RUNNER_TEMP/dmg"
          mkdir -p "$STAGE"
          cp "Install Pali TTS.command" pali_tts.py pali_core.py "$STAGE/"
          cp README_Mac.txt "$STAGE/Read Me.txt"
          cp LICENSE "$STAGE/License.txt"
          mkdir -p "$STAGE/.assets"
          cp assets/AppIcon.icns "$STAGE/.assets/"
          mkdir -p "$STAGE/.assets/voices"
          cp voices/*.onnx voices/*.onnx.json "$STAGE/.assets/voices/"
          chmod +x "$STAGE/Install Pali TTS.command"
          ditto runtime "$STAGE/.runtime"
          hdiutil create -volname "Pali TTS" -srcfolder "$STAGE" \
            -ov -format ULFO PaliTTS-macOS.dmg
          ls -lh PaliTTS-macOS.dmg

      - name: Smoke-test the installer from the DMG
        run: |
          set -e
          otool -L runtime/arm64/bin/python3 | head -5
          # Simulate a downloaded (quarantined) DMG
          xattr -w com.apple.quarantine "0081;00000000;Safari;" PaliTTS-macOS.dmg
          hdiutil attach PaliTTS-macOS.dmg -nobrowse
          # Choose "Just me", then press Enter at the final prompt
          printf '1\n\n' | bash "/Volumes/Pali TTS/Install Pali TTS.command"
          hdiutil detach "/Volumes/Pali TTS"
          APP="/Applications/Read Pāli Aloud.app"
          test -x "$APP/Contents/MacOS/ReadPaliAloud"
          test -f "$APP/Contents/Resources/AppIcon.icns"
          test -f "$APP/Contents/Resources/voices/kn_IN-syspin_male-medium.onnx.json"
          test -f "$HOME/Library/Services/Read Pali Aloud.workflow/Contents/document.wflow"
          grep -A1 COMMAND_STRING "$HOME/Library/Services/Read Pali Aloud.workflow/Contents/document.wflow"
          "$APP/Contents/MacOS/python3" -c 'import sys, edge_tts, tkinter; tkinter.Tcl(); print("runtime OK", sys.prefix)'
          (cd "$APP/Contents/Resources" && ../MacOS/python3 -c 'import sys; sys.argv = ["x"]; import pali_tts; print(pali_tts._to_kannada_local("sarīran\"ti aññaṃ"), pali_tts.system_voices()[:5], len(pali_tts.system_voices()))')
          # ññ spelling chosen by the teacher (number 4 = ನ್ನ್ಯ)
          (cd "$APP/Contents/Resources" && ../MacOS/python3 -c 'import sys; sys.argv = ["x"]; import pali_tts as p; k = p.to_kannada("aññaṃ, paññā, saññā"); print(k); assert "ನ್ನ್ಯ" in k and "ಞ್ಞ" not in k')
          print_segments='import sys; sys.argv = ["x"]; import pali_tts as p; print(p.split_segments("Evaṃ me sutaṃ.\nThus have I heard.\n如是我闻。\nDemikianlah yang saya dengar."))'
          (cd "$APP/Contents/Resources" && ../MacOS/python3 -c "$print_segments")
          # Translation voice + joining segments (offline, no Microsoft needed)
          cd "$RUNNER_TEMP"
          say -o en.aiff "Thus have I heard."
          "$APP/Contents/MacOS/python3" -c 'import sys; sys.argv=["x"]; sys.path.insert(0, "'"$APP"'/Contents/Resources"); import pali_tts as p; p.to_wav("en.aiff", "a.wav"); p.to_wav("en.aiff", "b.wav"); print("joined secs", p.join_wavs(["a.wav", "b.wav"], "j.wav")); p.wav_to_mp3("j.wav", "j.mp3"); v = p.system_voices(); print("auto voices:", {l: p.pick_voice(v, l) for l in ["zh", "ja", "ms", "es", "vi", "th"]})'
          afinfo j.mp3 | grep -i -E "duration|format"
          # Offline Pāli voices: Piper (bundled) at 1x and 0.33x, Soumya (if this Mac has it)
          "$APP/Contents/MacOS/python3" -c 'import sys; sys.argv=["x"]; sys.path.insert(0, "'"$APP"'/Contents/Resources"); import pali_tts as p
          print("model:", p.piper_model_path()); k = p.to_kannada("Evaṃ me sutaṃ. Ekaṃ samayaṃ bhagavā sāvatthiyaṃ viharati.")
          for rate in ["-25%", "-75%"]:
              out, secs = p.build_joined([("kn", k)], rate, "piper", None, 1.0); print("Piper", rate, "%.2f s" % secs); assert secs > 1.5
          try:
              out, secs = p.build_joined([("kn", k)], "-25%", "soumya", None, 1.0); print("Soumya %.2f s" % secs)
          except p.VoiceError as e:
              print("Soumya:", e)
          out, secs = p.build_joined([("kn", k), ("en", "Thus have I heard.")], "-25%", "piper", lambda l: "", 1.0); print("Both with Piper %.2f s" % secs)'
          defaults read pbs NSServicesStatus | tee "$RUNNER_TEMP/pbs.txt" || true
          grep -q '"@$y"' "$RUNNER_TEMP/pbs.txt" && echo "OK: shortcut Shift-Command-Y"

      - name: GUI screenshot test
        run: |
          APP="/Applications/Read Pāli Aloud.app"
          L="$APP/Contents/MacOS/ReadPaliAloud"
          SET="$HOME/Library/Application Support/PaliTTS/settings.json"
          mkdir -p shots
          sw_vers
          "$APP/Contents/MacOS/python3" -c 'import tkinter; r = tkinter.Tk(); print("Tk patchlevel", r.call("info", "patchlevel"), r.call("tk", "windowingsystem")); r.destroy()'
          python3 -m venv "$RUNNER_TEMP/pv"
          "$RUNNER_TEMP/pv/bin/pip" install -q pillow pyobjc-framework-Quartz pyobjc-framework-Vision
          check() { sleep "$2"; "$RUNNER_TEMP/pv/bin/python" .github/scripts/gui_check.py "$1"; pkill -f pali_tts.py || true; sleep 1; }
          printf 'Evaṃ me sutaṃ.\nThus have I heard.' | "$L" > shots/light.log 2>&1 &
          check light 8
          # Dark mode chosen in the app (system still light)
          mkdir -p "$(dirname "$SET")"; echo '{"dark": true, "mode": "both"}' > "$SET"
          printf 'Evaṃ me sutaṃ.\nThus have I heard.' | "$L" > shots/toggle-dark.log 2>&1 &
          check toggle-dark 8
          rm -f "$SET"
          osascript -e 'tell application "System Events" to tell appearance preferences to set dark mode to true' || echo "could not switch to dark mode"
          printf 'Evaṃ me sutaṃ. Ekaṃ samayaṃ bhagavā' | "$L" > shots/dark.log 2>&1 &
          check dark 8
          # Opened like from Launchpad (Dock name/icon must be the app's)
          open "$APP"
          check launchpad 10
          # The way the right-click Services menu runs it (Automator workflow)
          automator -i 'Evaṃ me sutaṃ. Ekaṃ samayaṃ bhagavā' "$HOME/Library/Services/Read Pali Aloud.workflow" > shots/service.log 2>&1 &
          check service 12
          # One copy only: a second start hands its text to the running copy (which reads it at once)
          export PALI_TTS_DUMP="$RUNNER_TEMP/dump.txt"
          printf 'Evaṃ me sutaṃ.' | "$L" > shots/first.log 2>&1 &
          sleep 8
          printf 'Ekaṃ samayaṃ bhagavā' | "$L" > shots/second.log 2>&1
          echo "second start exited: $?"
          sleep 2
          n=$(pgrep -f pali_tts.py | wc -l | tr -d ' ')
          echo "running copies: $n, text in the window: '$(cat "$PALI_TTS_DUMP")'"
          check single 1
          unset PALI_TTS_DUMP
          [ "$n" = 1 ] || { echo "FAIL: $n copies running"; exit 1; }
          grep -q "Text received from another start" shots/first.log || { echo "FAIL: text not handed over"; exit 1; }
          tail -n +1 shots/*.log

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-screenshots
          path: shots/
          retention-days: 7

      - name: Name the DMG "Read Pāli Aloud v<version>.dmg"
        run: |
          V=$(sed -n 's/^APP_VERSION = "\(.*\)"/\1/p' pali_tts.py)
          cp PaliTTS-macOS.dmg "Read Pāli Aloud v$V.dmg"
          ls -l *.dmg

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: PaliTTS-macOS
          path: Read*Aloud v*.dmg
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Read*Aloud v*.dmg
          generate_release_notes: true
